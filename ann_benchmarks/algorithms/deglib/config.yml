float:
  any:
  - base_args: ['@metric']
    constructor: DEG
    disabled: false
    docker_tag: ann-benchmarks-deglib
    module: ann_benchmarks.algorithms.deglib
    name: deg
    run_groups:
      fp32:
        args:
          dtype: ['float32']
          k: [16, 24, 30, 40, 48]
          opt_target: ['LowLID', 'StreamingData']
          prune_non_rng: [false, true]
        query_args: [[0.0, 0.005, 0.01, 0.02, 0.04, 0.06, 0.08, 0.1, 0.12, 0.15, 0.2, 0.25, 0.3]]
      int8_qg:
        args:
          dtype: ['int8']
          k: [16, 24, 30, 40, 48]
          opt_target: ['LowLID', 'StreamingData']
          prune_non_rng: [false, true]
        query_args:
          - [1.0, 1.2, 1.5, 2.0]
          - [0.0, 0.005, 0.01, 0.02, 0.04, 0.06, 0.08, 0.1, 0.12, 0.15, 0.2, 0.25, 0.3]
