float:
  any:
  - base_args: ['@metric']
    constructor: LanceDBIVFFlat
    disabled: false
    docker_tag: ann-benchmarks-lancedb
    module: ann_benchmarks.algorithms.lancedb
    name: lancedb-ivfflat
    run_groups:
      IVFFlat:
        args:
          num_partitions: [32, 64, 128, 256, 512]
        query_args:
          - [1, 5, 10, 20, 50, 100, 200]
          - [1, 5, 10]
  - base_args: ['@metric']
    constructor: LanceDBIVFPQ
    disabled: false
    docker_tag: ann-benchmarks-lancedb
    module: ann_benchmarks.algorithms.lancedb
    name: lancedb-ivfpq
    run_groups:
      IVFPQ:
        args:
          num_partitions: [32, 64, 128, 256, 512]
          num_sub_vectors: [2, 4]
        query_args:
          - [1, 5, 10, 20, 50, 100, 200]
          - [1, 5, 10]
  - base_args: ['@metric']
    constructor: LanceDBIVFHNSWSQ
    disabled: false
    docker_tag: ann-benchmarks-lancedb
    module: ann_benchmarks.algorithms.lancedb
    name: lancedb-ivfhnswsq
    run_groups:
      IVFHNSWSQ:
        args:
          num_partitions: [32, 64]
          m: [16, 32]
          efConstruction: [200, 500]
        query_args:
          - [5, 10, 20]
          - [10, 20, 40, 80]
          - [1, 5]
