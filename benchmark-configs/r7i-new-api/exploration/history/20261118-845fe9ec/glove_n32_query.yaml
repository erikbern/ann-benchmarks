# ANN distance-tolerance presets; native recall CLI reports strict ID recall. QueryParams overrides QueryParam. case 0: params in glove.json; case 1: params in glove.json; case 2: params in glove.json
IndexCommon:
  IndexConfig: "{\"index_type\":\"kHNSW\",\"data_type\":\"DT_FP32\",\n \"metric_type\"\
    :\"kCosine\",\"dimension\":100,\n \"m\":32,\"ef_construction\":400,\n \"use_id_map\"\
    :true,\"use_quantized_graph\":true,\n \"quantizer_param\":{\"type\":\"kNone\"\
    }}"
  IndexPath: /data/glove/r7i/n32.index
  TopK: 10
  QueryFile: /data/glove/queries.txt
  QueryFirstSep: ;
  QuerySecondSep: ' '
  QueryType: float
  RetrievalMode: dense
  FilterMode: none
  GroundTruthFile: /data/glove/neighbors.txt
  GroundTruthFirstSep: ;
  GroundTruthSecondSep: ' '
  CompareById: true
  RecallThreadCount: 1
  RecallBatchCount: 0
  RecallGTCount: 10
  RecallLogDir: /data/glove/r7i/n32_strict_id_logs
  BenchThreadCount: 1
  BenchThreadCounts:
  - 1
  BenchRounds: 5
  BenchSecs: 6
  BenchBatchCount: 1
  BenchIterCount: 1000000000
  LogLevel: info
QueryConfig:
  QueryParam: '{"ef_search": 128, "index_type": "kHNSW", "quantized_graph_bucket_width":
    0.002, "quantized_graph_margin": 0.0, "quantized_graph_max_expansions": 13, "quantized_graph_route_beam":
    1, "quantized_graph_uncertainty_bonus": 0}'
  QueryParams:
  - '{"ef_search": 128, "index_type": "kHNSW", "quantized_graph_bucket_width": 0.002,
    "quantized_graph_margin": 0.0, "quantized_graph_max_expansions": 13, "quantized_graph_route_beam":
    1, "quantized_graph_uncertainty_bonus": 0}'
  - '{"ef_search": 128, "index_type": "kHNSW", "quantized_graph_bucket_width": 0.002,
    "quantized_graph_margin": 0.0, "quantized_graph_max_expansions": 24, "quantized_graph_route_beam":
    1, "quantized_graph_uncertainty_bonus": 0}'
  - '{"ef_search": 128, "index_type": "kHNSW", "quantized_graph_bucket_width": 0.002,
    "quantized_graph_margin": 0.04, "quantized_graph_max_expansions": 64, "quantized_graph_route_beam":
    1, "quantized_graph_uncertainty_bonus": 0}'
